[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-drive-bridge"
version = "0.1.0"
description = "Persistent scientific SPE ingestion and Google Drive synchronization"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.5,<8"]
drive = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1"]

[project.scripts]
maestro-bridge = "maestro_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["maestro_bridge*"]

[tool.setuptools.package-data]
maestro_bridge = ["status.html", "assets/*.png", "assets/*.jpg"]
